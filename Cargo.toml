[workspace]
resolver = "2"
members = ["crates/yggmail", "crates/yggmail-mobile"]

# rustls форкнут ради одной строки: upstream рвёт handshake фатальным алертом на
# SNI от yggmail-go (одна 64-символьная метка > лимита DNS в 63). Подробности и
# обоснование — в комментарии к правке в server/hs.rs. Патч распространяется на
# весь граф сборки, включая rustls внутри Yggdrasil-ng.
#
# ОСТОРОЖНО при обновлении rustls. Если версия форка перестанет совпадать с той,
# что запрашивает граф, cargo МОЛЧА проигнорирует patch и соберёт версию с
# crates.io. Сборка останется зелёной, тесты пройдут, а входящие соединения от
# узлов 1.8 снова начнут умирать на handshake — без единого сообщения об ошибке.
# После любого поднятия версии обязательно проверять:
#     cargo tree -p yggmail -i rustls
# в выводе должен быть путь ../rustls-yggmail, а не registry+https://...
#
# Второе следствие форка: security-фиксы rustls сюда не приезжают сами. Обновлять
# осознанно, перенося правку на новый тег.
#
# Desktop-rs, когда дойдёт до QUIC, нуждается в таком же [patch.crates-io] —
# иначе получит ровно то же молчаливое отсутствие входящих соединений от 1.8.
[patch.crates-io]
rustls = { path = "../rustls-yggmail" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
